services:
  api:
    build:
      context: .
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    environment:
      TRADING_STORAGE_BACKEND: postgres
      TRADING_DATABASE_URL: ${TRADING_DATABASE_URL:?Set TRADING_DATABASE_URL in .env}
      TRADING_REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    command: ["sh", "-c", "uv run --no-sync alembic upgrade head && uv run --no-sync uvicorn api.app:app --host 0.0.0.0 --port 8000"]
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  redis_data:
